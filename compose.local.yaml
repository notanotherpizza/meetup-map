services:
  postgres:
    image: postgres:16
    container_name: meetupmap-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=meetupmap
      - POSTGRES_PASSWORD=meetupmap
      - POSTGRES_DB=meetupmap
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - meetupmap

  grafana:
    image: grafana/grafana:latest
    container_name: meetupmap-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - meetupmap

networks:
  meetupmap:

volumes:
  postgres-data:
  grafana-data:
