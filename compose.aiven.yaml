version: "3.8"

x-discovery-env: &discovery-env
  APP_MODE: discovery
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  KAFKA_SSL_CA: ${KAFKA_SSL_CA}
  KAFKA_SSL_CERT: ${KAFKA_SSL_CERT}
  KAFKA_SSL_KEY: ${KAFKA_SSL_KEY}

x-worker-env: &worker-env
  APP_MODE: worker
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  KAFKA_SSL_CA: ${KAFKA_SSL_CA}
  KAFKA_SSL_CERT: ${KAFKA_SSL_CERT}
  KAFKA_SSL_KEY: ${KAFKA_SSL_KEY}
  TOPIC_GROUPS_TO_SCRAPE: groups-to-scrape
  TOPIC_GROUPS_RAW: groups-raw
  TOPIC_EVENTS_RAW: events-raw
  TOPIC_VENUES_RAW: venues-raw
  MAX_EVENTS_PER_GROUP: "50"
  REQUEST_DELAY_SECONDS: "1.5"

x-sink-env: &sink-env
  APP_MODE: sink
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  KAFKA_SSL_CA: ${KAFKA_SSL_CA}
  KAFKA_SSL_CERT: ${KAFKA_SSL_CERT}
  KAFKA_SSL_KEY: ${KAFKA_SSL_KEY}
  POSTGRES_URI: ${POSTGRES_URI}
  TOPIC_GROUPS_RAW: groups-raw
  TOPIC_EVENTS_RAW: events-raw
  TOPIC_VENUES_RAW: venues-raw

services:
  # Discovery workers - search Meetup/Luma APIs for groups
  discovery-1:
    build: .
    environment:
      <<: *discovery-env
      WORKER_ID: discovery-1

  discovery-2:
    build: .
    environment:
      <<: *discovery-env
      WORKER_ID: discovery-2

  discovery-3:
    build: .
    environment:
      <<: *discovery-env
      WORKER_ID: discovery-3

  # Scrape workers - fetch group details and events
  worker-1:
    build: .
    environment:
      <<: *worker-env
      WORKER_ID: worker-1

  worker-2:
    build: .
    environment:
      <<: *worker-env
      WORKER_ID: worker-2

  worker-3:
    build: .
    environment:
      <<: *worker-env
      WORKER_ID: worker-3

  # Sink workers - write to Postgres
  sink-1:
    build: .
    environment:
      <<: *sink-env
      SINK_ID: sink-1

  sink-2:
    build: .
    environment:
      <<: *sink-env
      SINK_ID: sink-2

  sink-3:
    build: .
    environment:
      <<: *sink-env
      SINK_ID: sink-3
