name: Build and push Docker images

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'batch-worker/**'
      - 'download_service/**'
      - 'shared/**'
      - 'map/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'Dockerfile.download'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            tag: batch
          - dockerfile: Dockerfile.download
            tag: download

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/notanotherpizza/meetup-map-${{ matrix.tag }}:latest
            ghcr.io/notanotherpizza/meetup-map-${{ matrix.tag }}:${{ github.sha }}
