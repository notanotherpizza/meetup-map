name: Batch scrape

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max groups to scrape (0 = all)"
        default: "0"
      mode:
        description: "Mode: batch | discover-only | scrape-only"
        default: "batch"
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 600   # 10h max — full 24k scrape takes ~8h at 1.5s/group

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[download]"

      - name: Run batch
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          MAX_EVENTS_PER_GROUP:  "0"
          REQUEST_DELAY_SECONDS: "1.5"
        run: |
          MODE="${{ github.event.inputs.mode || 'batch' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          case "$MODE" in
            discover-only) python -m batch-worker.run --discover-only ;;
            scrape-only)   python -m batch-worker.run --scrape-only --limit "$LIMIT" ;;
            *)             python -m batch-worker.run --limit "$LIMIT" ;;
          esac

      - name: Commit updated group list
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add community/
          git diff --staged --quiet || git commit -m "chore: update group list $(date -u +%Y-%m-%dT%H:%M UTC)"
          git push
