services:
  batch:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_MODE: batch-scrape-only
      REQUEST_DELAY_SECONDS: "1.5"
      MAX_EVENTS_PER_GROUP: "0"
      # Always scrape the live list rather than the one baked into the image
      GROUPS_URL: https://raw.githubusercontent.com/notanotherpizza/meetup-map/main/community/groups.txt
    restart: "no"

  download:
    build:
      context: .
      dockerfile: Dockerfile.download
    environment:
      REQUEST_DELAY_SECONDS: "1.5"
      MAX_EVENTS_PER_GROUP: "0"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/stats')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
