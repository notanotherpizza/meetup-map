[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetupmap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "structlog>=24.2",
    "rich>=13.7",
    "pyiceberg[s3fs,pyarrow]>=0.7",
    "pyarrow>=16",
    "pandas>=2.2",
    "duckdb>=1.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# pip install ".[download]" — for Dockerfile.download
download = [
    "duckdb>=1.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
meetupmap-batch    = "batch-worker.run:entrypoint"
meetupmap-worker   = "worker.scraper:main"
meetupmap-download = "download_service.serve:main"

[tool.setuptools.packages.find]
include = ["worker*", "shared*", "map*", "community*", "batch-worker*", "download_service*"]

[tool.ruff]
line-length = 100