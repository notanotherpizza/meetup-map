services:
  batch:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_MODE: batch
      REQUEST_DELAY_SECONDS: "1.5"
      MAX_EVENTS_PER_GROUP: "0"
    restart: "no"

  download:
    build:
      context: .
      dockerfile: Dockerfile.download
    environment:
      REQUEST_DELAY_SECONDS: "1.5"
      MAX_EVENTS_PER_GROUP: "0"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/stats')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
