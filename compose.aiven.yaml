services:
  lakekeeper-migrate:
    build:
      context: .
      dockerfile: Dockerfile.lakekeeper-migrate
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY}
      LAKEKEEPER__PG_DATABASE_URL_READ: ${LAKEKEEPER_PG_URL}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: ${LAKEKEEPER_PG_URL}
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      LAKEKEEPER__BASE_URI: ${LAKEKEEPER_BASE_URI}
    restart: "no"

  lakekeeper:
    build:
      context: .
      dockerfile: Dockerfile.lakekeeper
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY}
      LAKEKEEPER__PG_DATABASE_URL_READ: ${LAKEKEEPER_PG_URL}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: ${LAKEKEEPER_PG_URL}
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      LAKEKEEPER__BASE_URI: ${LAKEKEEPER_BASE_URI}
    ports:
      - "8181:8181"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  batch:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_MODE: batch
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      LAKEKEEPER_CATALOG_URI: ${LAKEKEEPER_CATALOG_URI}
      REQUEST_DELAY_SECONDS: "1.5"
      MAX_EVENTS_PER_GROUP: "0"
    restart: "no"

  download:
    build:
      context: .
      dockerfile: Dockerfile.download
    environment:
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      LAKEKEEPER_CATALOG_URI: ${LAKEKEEPER_CATALOG_URI}
      REQUEST_DELAY_SECONDS: "1.5"
      MAX_EVENTS_PER_GROUP: "0"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/stats')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
