x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
  LAKEKEEPER__PG_DATABASE_URL_READ: ${LAKEKEEPER_PG_URL}
  LAKEKEEPER__PG_DATABASE_URL_WRITE: ${LAKEKEEPER_PG_URL}
  LAKEKEEPER__AUTHZ_BACKEND: allowall
  LAKEKEEPER__BASE_URI: ${LAKEKEEPER_BASE_URI}

x-common-env: &common-env
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
  LAKEKEEPER_CATALOG_URI: ${LAKEKEEPER_CATALOG_URI}
  REQUEST_DELAY_SECONDS: "1.5"
  MAX_EVENTS_PER_GROUP: "0"

services:
  # ── Lakekeeper DB migration (runs once on deploy) ───────────────────────────
  lakekeeper-migrate:
    build:
      context: .
      dockerfile: Dockerfile.lakekeeper
    environment:
      <<: *lakekeeper-env
    command: ["migrate"]
    restart: "no"

  # ── Lakekeeper REST catalog ─────────────────────────────────────────────────
  lakekeeper:
    build:
      context: .
      dockerfile: Dockerfile.lakekeeper
    environment:
      <<: *lakekeeper-env
    command: ["serve"]
    ports:
      - "8181:8181"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Daily batch worker ──────────────────────────────────────────────────────
  batch:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *common-env
      APP_MODE: batch
    restart: "no"

  # ── Download / search API ───────────────────────────────────────────────────
  download:
    build:
      context: .
      dockerfile: Dockerfile.download
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/stats')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
